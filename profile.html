<!DOCTYPE html>
<html lang="en">
<head>
<title>Beacons - Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="header">
  <div class="logo">BEACONS</div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
  <div class="main">
    
    <!-- PROFILE CARD -->
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar" id="avatar">G</div>
        <div>
          <h2 id="profileName">Guest User</h2>
          <p id="profilePhone">Not Set</p>
          <span class="badge">Account</span>
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-box">
        <p>Total Invested</p>
        <h3 id="totalInvested">Ksh 0</h3>
      </div>
      <div class="stat-box">
        <p>Total Earned</p>
        <h3 class="profit" id="totalEarned">Ksh 0</h3>
      </div>
      <div class="stat-box">
        <p>Active Plans</p>
        <h3 id="activePlans">0</h3>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="card">
      <h3>Account Settings</h3>
      <form id="profileForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="phone" placeholder="+254 7xx xxx" disabled>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" placeholder="Leave blank to keep current">
        </div>
        <button type="submit" class="save-btn">Save Changes</button>
        <p class="success" id="successMsg"></p>
      </form>
    </div>

  </div>
  
  <!-- SIDEBAR -->
  <div class="sidebar-right" id="sidebar">
    <h3>MENU</h3>
    <div class="menu-item" onclick="window.location='dashboard.html'">🏠 Dashboard</div>
    <div class="menu-item">📈 Invest</div>
    <div class="menu-item">💳 Wallet</div>
    <div class="menu-item">📜 History</div>
    <div class="menu-item active">👤 Profile</div>
    <div class="menu-item">⚙️ Settings</div>
    <hr>
    <div class="menu-item" onclick="logout()">🚪 Logout</div>
  </div>
</div>

<script src="dashboard.js"></script>
<script src="profile.js"></script>
</body>
</html>
