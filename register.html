<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Beacons Investment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
}

.container{
    position:relative;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 25px rgba(0,229,255,.3);
    text-align:center;
    z-index:1;
}

.logo{
    font-size:55px;
}

h2{
    color:#00e5ff;
    margin:15px 0 25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:16px;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:#00e5ff;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00ff88;
}

p{
    margin-top:20px;
    color:#fff;
}

a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:bold;
}

#message{
    margin-top:15px;
    color:#00ff88;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🚨</div>

<h2>Create Account</h2>

<form id="registerForm">

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">
Create Account
</button>

</form>

<div id="message"></div>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>
const form=document.getElementById("registerForm");

form.addEventListener("submit",async(e)=>{
e.preventDefault();

const fullname=document.getElementById("fullname").value;
const email=document.getElementById("email").value;
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;
const message=document.getElementById("message");

if(password!==confirm){
message.style.color="red";
message.innerHTML="Passwords do not match.";
return;
}

try{

const response=await fetch("/api/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
fullname,
email,
password
})
});

const data=await response.json();

if(data.success){
message.style.color="#00ff88";
message.innerHTML="Registration successful! Redirecting...";

setTimeout(()=>{
window.location="login.html";
},1500);

}else{
message.style.color="red";
message.innerHTML=data.message;
}

}catch(error){
message.style.color="red";
message.innerHTML="Server error. Please try again.";
}

});
</script>

</body>
  </html>
