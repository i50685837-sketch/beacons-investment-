<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Beacons Investment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1800&q=80") center/cover no-repeat fixed;
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.60);
}

/* Water animation */
.water{
    position:absolute;
    width:200%;
    height:200%;
    background:radial-gradient(circle,rgba(255,255,255,.08) 2px,transparent 2px);
    background-size:50px 50px;
    animation:wave 15s linear infinite;
}

@keyframes wave{
    from{transform:translate(0,0);}
    to{transform:translate(-100px,-50px);}
}

.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:420px;
    padding:35px;
    text-align:center;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.2);

    box-shadow:0 0 30px rgba(0,229,255,.3);
}

.logo{
    font-size:60px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
50%{transform:scale(1.15);}
}

h2{
    color:#00e5ff;
    margin:15px 0 25px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:16px;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#00d4ff,#00ff88);
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #00ff88;
}

#message{
    margin-top:15px;
    color:#00ff88;
}

p{
    margin-top:20px;
    color:#fff;
}

a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    color:#00ff88;
}
</style>
</head>

<body>

<div class="water"></div>

<div class="container">

<div class="logo">🚨</div>

<h2>Create Your Account</h2>

<form id="registerForm">

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">
Create Account
</button>

</form>

<div id="message"></div>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>
const form=document.getElementById("registerForm");

form.addEventListener("submit",async(e)=>{
e.preventDefault();

const fullname=document.getElementById("fullname").value;
const email=document.getElementById("email").value;
const phone=document.getElementById("phone").value;
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;
const message=document.getElementById("message");

if(password!==confirm){
message.style.color="red";
message.innerHTML="Passwords do not match.";
return;
}

try{

const response=await fetch("/api/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
fullname,
email,
phone,
password
})
});

const data=await response.json();

if(data.success){
message.style.color="#00ff88";
message.innerHTML="Registration successful! Redirecting...";

setTimeout(()=>{
window.location.href="login.html";
},1500);

}else{
message.style.color="red";
message.innerHTML=data.message || "Registration failed.";
}

}catch(error){
message.style.color="red";
message.innerHTML="Unable to connect to the server.";
}

});
</script>

</body>
  </html>
