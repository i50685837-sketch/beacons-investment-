<!DOCTYPE html>
<html lang="en">
<head>
<title>Beacons - Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-box">
    <h1 class="logo">BEACONS</h1>
    <h2>Create Account</h2>
    <p class="sub">Start investing from Ksh 750</p>
    
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Kamau">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" required placeholder="07xx xxx xxx">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Min 6 characters">
      </div>
      <p class="error" id="errorMsg"></p>
      <button type="submit" class="btn-red">Start Investing</button>
    </form>
    
    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
