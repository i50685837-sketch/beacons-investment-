<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacons Investment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    /* Replace with your own image if desired */
    background:url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1600&q=80") center center/cover no-repeat fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:760px;
    padding:50px 35px;
    text-align:center;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    box-shadow:0 0 40px rgba(0,229,255,.3);

    animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    font-size:70px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.15);
    }
}

h1{
    margin-top:10px;
    color:#00e5ff;
    font-size:46px;
    text-shadow:0 0 20px #00e5ff;
}

.tagline{
    margin:30px 0;
    font-size:30px;
    color:#fff;
    line-height:1.6;
    font-weight:bold;
}

.highlight{
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
}

button{
    margin-top:10px;
    padding:18px 60px;
    border:none;
    border-radius:50px;
    background:#00e5ff;
    color:#000;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 25px #00e5ff;
}

button:hover{
    transform:scale(1.08);
    background:#00ff88;
    box-shadow:0 0 35px #00ff88;
}

.contact{
    margin-top:45px;
    color:#fff;
    font-size:18px;
}

.contact a{
    color:#00e5ff;
    text-decoration:none;
}

.footer{
    margin-top:20px;
    color:#ccc;
    font-size:14px;
}

@media(max-width:768px){

h1{
    font-size:34px;
}

.tagline{
    font-size:22px;
}

button{
    width:100%;
}

.logo{
    font-size:55px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="logo">🚨</div>

<h1>Beacons Investment</h1>

<div class="tagline">
Start investing from
<span class="highlight">750</span><br>
Build your financial future with<br>
<span class="highlight">Beacons Investment</span>
</div>

<button onclick="window.location.href='register.html'">
Get Started
</button>

<div class="contact">
<h3>Contact Us</h3>
📧 <a href="mailto:beacons@gmail.com">beacons@gmail.com</a>
</div>

<div class="footer">
© 2026 Beacons Investment. All Rights Reserved.
</div>

</div>

</body>
</html>
