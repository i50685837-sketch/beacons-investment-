<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Beacons Investment</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    .wallet-card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .balance { font-size: 2rem; font-weight: bold; color: #00ff88; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #333; color: #fff; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #00ff88; color: #000; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .hint { font-size: 12px; color: #aaa; margin-top: 5px; }
    .error { color: #ff4d4d; font-size: 13px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>My Wallet</h2>

    <div class="wallet-card">
      <p>Available Balance</p>
      <div class="balance" id="balance">Ksh 0.00</div>
      <p style="font-size: 12px; color: #aaa;">Invested: Ksh <span id="invested">0</span> | Earned: Ksh <span id="earned">0</span></p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('deposit')">Deposit</button>
      <button class="tab-btn" onclick="showTab('withdraw')">Withdraw</button>
    </div>

    <!-- DEPOSIT TAB -->
    <div id="deposit" class="tab-content active">
      <div class="card">
        <h3>Deposit via M-PESA</h3>
        <form id="depositForm">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="depositPhone" placeholder="2547xx xxx" required>
          </div>
          <div class="form-group">
            <label>Amount</label>
            <input type="number" id="depositAmount" placeholder="Min Ksh 850" required>
            <p class="hint">Minimum deposit is Ksh 850</p>
            <p class="error" id="depositError"></p>
          </div>
          <button type="submit" class="save-btn">Deposit Now</button>
        </form>
      </div>
    </div>

    <!-- WITHDRAW TAB -->
    <div id="withdraw" class="tab-content">
      <div class="card">
        <h3>Withdraw to M-PESA</h3>
        <form id="withdrawForm">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="withdrawPhone" placeholder="2547xx xxx" required>
          </div>
          <div class="form-group">
            <label>Amount</label>
            <input type="number" id="withdrawAmount" placeholder="Min Ksh 1,500" required>
            <p class="hint">Minimum withdraw is Ksh 1,500</p>
            <p class="error" id="withdrawError"></p>
          </div>
          <button type="submit" class="save-btn" style="background:#ff4d4d;">Request Withdraw</button>
        </form>
      </div>
    </div>

    <a href="dashboard.html" style="display:block; margin-top:20px; text-align:center;">Back to Dashboard</a>
  </div>

  <script src="auth.js"></script>
  <script>
    // Load user balance
    const user = JSON.parse(localStorage.getItem('user'));
    if(user){
      document.getElementById('balance').innerText = `Ksh ${user.balance.toLocaleString()}`;
      document.getElementById('invested').innerText = user.invested.toLocaleString();
      document.getElementById('earned').innerText = user.earned.toLocaleString();
    }

    function showTab(tab){
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    // DEPOSIT LOGIC
    document.getElementById('depositForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('depositPhone').value;
      const amount = parseInt(document.getElementById('depositAmount').value);
      const errorEl = document.getElementById('depositError');
      errorEl.innerText = '';

      if(amount < 850){
        errorEl.innerText = 'Minimum deposit is Ksh 850';
        return;
      }

      const res = await fetch('/api/mpesa/stkpush', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone, amount})
      });
      const data = await res.json();
      alert('Check your phone to enter M-PESA PIN');
    });

    // WITHDRAW LOGIC
    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('withdrawPhone').value;
      const amount = parseInt(document.getElementById('withdrawAmount').value);
      const errorEl = document.getElementById('withdrawError');
      errorEl.innerText = '';

      if(amount < 1500){
        errorEl.innerText = 'Minimum withdraw is Ksh 1,500';
        return;
      }
      if(amount > user.balance){
        errorEl.innerText = 'Insufficient balance';
        return;
      }

      // Hapa utatuma kwa backend yako ya withdraw
      const res = await fetch('/api/withdraw', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({userId: user.id, phone, amount})
      });
      const data = await res.json();
      alert(data.message || 'Withdraw request submitted');
    });
  </script>
</body>
</html>
