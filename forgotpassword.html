<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover Account | Beacons Investment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1800&q=80")
    center/cover no-repeat fixed;
}

.container{
    width:90%;
    max-width:430px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 0 30px rgba(0,229,255,.35);
}

.logo{
    font-size:60px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.12);
}
}

h2{
    color:#00e5ff;
    margin:15px 0;
}

p{
    color:#ddd;
    margin-bottom:20px;
    line-height:1.5;
}

input{
    width:100%;
    padding:15px;
    margin:12px 0;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:16px;
}

input::placeholder{
    color:#ccc;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:40px;
    background:linear-gradient(90deg,#00d4ff,#00ff88);
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #00ff88;
}

#message{
    margin-top:18px;
    font-weight:bold;
}

.back{
    margin-top:25px;
}

.back a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:bold;
}

.back a:hover{
    color:#00ff88;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🚨</div>

<h2>Recover Your Account</h2>

<p>
Enter the email address linked to your account.
If it exists, we'll send you instructions to reset your password.
</p>

<form id="recoverForm">

<input
type="email"
id="email"
placeholder="Enter your email address"
required>

<button type="submit">
Send Recovery Link
</button>

</form>

<div id="message"></div>

<div class="back">
<a href="login.html">← Back to Login</a>
</div>

</div>

<script>
document.getElementById("recoverForm").addEventListener("submit", async(e)=>{
e.preventDefault();

const email=document.getElementById("email").value;
const message=document.getElementById("message");

try{

const response=await fetch("/api/forgot-password",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({email})
});

const data=await response.json();

if(data.success){
message.style.color="#00ff88";
message.innerHTML="✅ Recovery link sent successfully.";
}else{
message.style.color="red";
message.innerHTML=data.message || "Unable to send recovery link.";
}

}catch{

message.style.color="red";
message.innerHTML="❌ Server unavailable. Please try again later.";

}

});
</script>

</body>
</html>
