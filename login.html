<!DOCTYPE html>
<html lang="en">
<head>
<title>Beacons - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-box">
    <h1 class="logo">BEACONS</h1>
    <h2>Welcome Back</h2>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" required placeholder="07xx xxx">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>
      <p class="error" id="errorMsg"></p>
      <button type="submit" class="btn-red">Login</button>
    </form>
    
    <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
