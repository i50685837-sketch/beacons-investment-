<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Beacons Investment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#06142d,#0b2d59,#04111f);
overflow:hidden;
position:relative;
}

body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:#00ff9540;
border-radius:50%;
top:-120px;
left:-120px;
filter:blur(90px);
}

body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:#ff404040;
border-radius:50%;
bottom:-120px;
right:-120px;
filter:blur(90px);
}

.container{
width:400px;
max-width:90%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:35px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.4);
position:relative;
z-index:1;
}

h2{
text-align:center;
color:#fff;
margin-bottom:10px;
}

h2 span{
color:#00ff95;
}

p{
text-align:center;
color:#ddd;
margin-bottom:25px;
line-height:1.6;
}

.input-box{
margin-bottom:20px;
}

.input-box input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:10px;
background:#ffffff15;
color:#fff;
font-size:15px;
}

.input-box input::placeholder{
color:#ccc;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#ff3030,#ff8800);
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

.back{
text-align:center;
margin-top:20px;
}

.back a{
color:#00ff95;
text-decoration:none;
font-weight:600;
}
</style>

</head>

<body>

<div class="container">

<h2>Forgot <span>Password</span></h2>

<p>
Enter your email address and we'll send you a password reset link.
</p>

<form action="/forgot-password" method="POST">

<div class="input-box">
<input
type="email"
name="email"
placeholder="Enter your email"
required>
</div>

<button type="submit">
Send Reset Link
</button>

</form>

<div class="back">
<a href="login.html">← Back to Login</a>
</div>

</div>

  <script src="forgot-password.js"></script>
</body>
  </html>
